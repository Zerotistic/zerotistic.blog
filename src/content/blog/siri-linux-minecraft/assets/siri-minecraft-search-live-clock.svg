<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1040" viewBox="0 0 560 1040" role="img" aria-labelledby="title desc">
<title id="title">Siri searches for a Minecraft integration</title>
<desc id="desc">An iPhone with Siri search results from Apple Support, Stack Overflow, and Minecraft Wiki.</desc>
<defs>
 <linearGradient id="metal"><stop stop-color="#77777b"/><stop offset=".025" stop-color="#252527"/><stop offset=".5" stop-color="#49494c"/><stop offset=".975" stop-color="#242426"/><stop offset="1" stop-color="#858589"/></linearGradient>
 <linearGradient id="wallpaper" x2=".8" y2="1"><stop stop-color="#29394d"/><stop offset=".5" stop-color="#18212e"/><stop offset="1" stop-color="#15151f"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#edffff"/><stop offset=".24" stop-color="#91ecf7"/><stop offset=".5" stop-color="#5088ea"/><stop offset=".75" stop-color="#26264b"/><stop offset="1" stop-color="#121420"/></radialGradient>
 <linearGradient id="ribbon" x2="1" y2=".5"><stop stop-color="#31d7ff"/><stop offset=".36" stop-color="#8defff"/><stop offset=".6" stop-color="#d7b4ff"/><stop offset=".83" stop-color="#ef57a4"/><stop offset="1" stop-color="#fd976a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-15%" width="160%" height="140%"><feDropShadow dy="15" stdDeviation="16" flood-opacity=".4"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="orbClip"><circle cx="280" cy="889" r="29"/></clipPath>
</defs>
<!-- The live clock is rendered by the page; this artwork has no static time. -->
<!-- Metal edge, side buttons, and inset glass. -->
<g fill="#48484c"><rect x="54" y="158" width="4" height="28" rx="2"/><rect x="54" y="216" width="4" height="65" rx="2"/><rect x="54" y="298" width="4" height="65" rx="2"/><rect x="502" y="239" width="4" height="99" rx="2"/></g>
<rect x="57" y="38" width="446" height="944" rx="66" fill="url(#metal)" filter="url(#shadow)"/>
<rect x="60" y="41" width="440" height="938" rx="63" fill="#050506" stroke="#a1a1a6" stroke-opacity=".35"/>
<rect x="70" y="51" width="420" height="918" rx="53" fill="url(#wallpaper)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#f5f5f7">
 <rect x="216" y="65" width="128" height="36" rx="18" fill="#030304"/><circle cx="324" cy="83" r="5" fill="#0c1019"/><circle cx="325" cy="82" r="2" fill="#18243a"/>
 <g transform="translate(383 77)" fill="#fff"><rect y="9" width="3" height="4" rx=".8"/><rect x="5" y="6" width="3" height="7" rx=".8"/><rect x="10" y="3" width="3" height="10" rx=".8"/><rect x="15" width="3" height="13" rx=".8"/></g>
 <path d="M409 80q7-6 14 0m-11 4q4-3 8 0" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round"/><circle cx="416" cy="88" r="1.5"/>
 <rect x="432" y="77" width="24" height="12" rx="3.5" stroke="#fff" stroke-opacity=".45" fill="none"/><rect x="434" y="79" width="18" height="8" rx="1.5"/><path d="M458 81v4" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
 <text x="280" y="160" text-anchor="middle" font-size="23" font-weight="500" letter-spacing="-.5"><tspan x="280">“Can I put Siri in my</tspan><tspan x="280" dy="29">Minecraft server?”</tspan></text>
 <text x="95" y="254" font-size="29" font-weight="600" letter-spacing="-.8">Here's what I found.</text>
 <!-- Translucent results sheet with compact source labels. -->
 <rect x="86" y="280" width="388" height="518" rx="22" fill="#343944" fill-opacity=".89" stroke="#fff" stroke-opacity=".09"/>
 <g transform="translate(104 300)">
  <rect width="23" height="23" rx="6" fill="#eeeef0"/>
  <path d="M14 5c0 2-1 3-3 3 0-2 1-3 3-3Zm3 7c0-2 1-3 2-3-1-2-3-2-4-1l-2 1-2-1c-3-1-5 2-4 5 1 3 2 6 4 6l2-1 2 1c2 0 4-3 4-4-1 0-2-1-2-3Z" fill="#29292c"/>
  <text x="32" y="10" font-size="12" font-weight="500">Apple Support</text><text x="32" y="25" font-size="10.5" fill="#b5b6bf">support.apple.com</text>
  <text y="58" font-size="19" font-weight="500" letter-spacing="-.3">Use Siri on your iPhone</text>
  <text y="84" font-size="14" fill="#c7c8d0"><tspan x="0">Learn how to ask Siri a question. First,</tspan><tspan x="0" dy="20">you'll need an iPhone. So that's going well.</tspan></text>
 </g>
 <path d="M104 446h352" stroke="#fff" stroke-opacity=".12"/>
 <g transform="translate(104 465)">
  <rect width="23" height="23" rx="6" fill="#f3f3f4"/>
  <g stroke="#e88132" stroke-width="1.8" fill="none"><path d="M5 15v5h14v-5M8 16h8M8 12l9 2M10 8l8 4M13 4l6 6"/></g>
  <text x="32" y="10" font-size="12" font-weight="500">Stack Overflow</text><text x="32" y="25" font-size="10.5" fill="#b5b6bf">stackoverflow.com</text>
  <text y="58" font-size="19" font-weight="500" letter-spacing="-.3">Siri in a Minecraft server? [closed]</text>
  <text y="84" font-size="14" fill="#c7c8d0"><tspan x="0">Asked 12 years ago · Viewed 43 times</tspan><tspan x="0" dy="20">This question does not appear to be about</tspan><tspan x="0" dy="20">programming within the scope of the help center.</tspan></text>
 </g>
 <path d="M104 632h352" stroke="#fff" stroke-opacity=".12"/>
 <g transform="translate(104 651)">
  <rect width="23" height="23" rx="6" fill="#253f23"/><path d="m4 7 8-4 8 4-8 4Z" fill="#85b75e"/><path d="m4 7 8 4v10l-8-5Z" fill="#886345"/><path d="m12 11 8-4v9l-8 5Z" fill="#5d432f"/><path d="m4 7 8 4v3L4 10Zm8 4 8-4v3l-8 4Z" fill="#567d3c"/>
  <text x="32" y="10" font-size="12" font-weight="500">Minecraft Wiki</text><text x="32" y="25" font-size="10.5" fill="#b5b6bf">minecraft.wiki</text>
  <text y="58" font-size="19" font-weight="500" letter-spacing="-.3">Redstone comparator</text>
  <text y="84" font-size="14" fill="#c7c8d0"><tspan x="0">A redstone comparator can compare signals,</tspan><tspan x="0" dy="20">subtract signals, and still can't tell you</tspan><tspan x="0" dy="20">why your authentication blob is invalid.</tspan></text>
 </g>
 <text x="274" y="831" text-anchor="middle" fill="#adaeb8" font-size="13">Search the web</text><path d="m325 826 4 4-4 4" stroke="#adaeb8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Voice overlay orb and home indicator. -->
<circle cx="280" cy="889" r="31" fill="#6b73cf" opacity=".2" filter="url(#glow)"/>
<circle cx="280" cy="889" r="29" fill="url(#orb)" stroke="#d5e5ff" stroke-opacity=".18"/>
<g clip-path="url(#orbClip)">
 <path d="M247 890c17-31 27 31 41-1s22-6 28 4" stroke="url(#ribbon)" stroke-width="12" fill="none" filter="url(#glow)"/>
 <path d="M247 890c17-31 27 31 41-1s22-6 28 4" stroke="url(#ribbon)" stroke-width="3" fill="none"/>
 <path d="M250 899c19 14 31-27 43-12s15 12 21 8" stroke="#c1eaff" stroke-opacity=".7" stroke-width="2" fill="none"/>
</g>
<rect x="210" y="951" width="140" height="5" rx="2.5" fill="#fff" opacity=".9"/>
</svg>
